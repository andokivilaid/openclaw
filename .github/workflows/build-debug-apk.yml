name: Build Custom Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/voice-talk-dashboard-widget

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd apps/android
          ./gradlew :app:assembleDebug

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find apps/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" openclaw-voice-widget-debug.apk
          echo "apk_path=openclaw-voice-widget-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-voice-widget-debug
          path: openclaw-voice-widget-debug.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="custom-android-$(date +'%Y%m%d%H%M%S')"
          gh release create "$TAG" openclaw-voice-widget-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Custom Android Build · Voice Talk Dashboard Widget" \
            --notes "Custom OpenClaw Android build with dedicated dashboard Voice Talk widget and compact waveform modal."
